volumes:
  data-vol:

networks:
  mynet:

services:
  db:
    image: stackupiss/northwind-db:v1
    build:
      context: ./db
    networks:
    - my-net
    volumes:
    - data-vol:/var/lib/mysql
    # docker run -d -p 8080:3000 --namespace --network=mynet \
    # -e DB_HOST=db -d DB_USER=root -d DB_PASSWORD=changeit stackupiss/northwind-app:v1
  app:
    image: stackupiss/northwind-app:v1
    networks:
    - my-net
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=changeit
    ports:
      - "8080:3000"