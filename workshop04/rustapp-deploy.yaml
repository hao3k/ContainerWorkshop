apiVersion: v1
kind: Namespace
metadata:
  name: workshop04

---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-nodes
  namespace: workshop04
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: rustfs
  ports:
  - name: s3
    port: 9000
    targetPort: s3
    protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: workshop04
spec:
  serviceName: rustfs-nodes
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: rustfs
        image: ghcr.io/rustfs-software/rustfs:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: rustfs-config
        - secretRef:
            name: rustfs-credentials
        ports:
        - name: s3
          containerPort: 9000
          protocol: TCP
        - name: console
          containerPort: 9001
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          tcpSocket:
            port: s3
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: s3
          initialDelaySeconds: 30
          periodSeconds: 20
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-s3
  namespace: workshop04
spec:
  type: ClusterIP
  selector:
    app: rustfs
  ports:
  - name: s3
    port: 9000
    targetPort: s3
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-console
  namespace: workshop04
spec:
  type: ClusterIP
  selector:
    app: rustfs
  ports:
  - name: console
    port: 9001
    targetPort: console
    protocol: TCP

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-s3-route
  namespace: workshop04
spec:
  hostnames:
  - data.172.25.39.200.nip.io
  parentRefs:
  - name: default-gtw
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rustfs-s3
      port: 9000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console-route
  namespace: workshop04
spec:
  hostnames:
  - console.172.25.39.200.nip.io
  parentRefs:
  - name: default-gtw
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rustfs-console
      port: 9001
